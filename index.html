<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mosca del WIP</title>
  </head>
  <body>
    <canvas id="lienzo-3d"></canvas>

    <aside id="panel">
      <header class="cabecera">
        <h1>Mosca del WIP</h1>
        <p class="subtitulo">Un día de oficina, de 09:00 a 18:00</p>
      </header>

      <section class="bloque">
        <div class="bloque-fila">
          <label for="wip" class="etiqueta">Tareas en curso a la vez</label>
          <span class="wip-numero" id="wip-valor">3</span>
        </div>
        <input type="range" id="wip" min="1" max="10" step="1" value="3" aria-describedby="wip-nota" />
        <div class="escala" aria-hidden="true">
          <span>1</span><span>3</span><span>10</span>
        </div>
        <p class="nota" id="wip-nota">Dentro del límite sano</p>
      </section>

      <section class="bloque">
        <div class="bloque-fila">
          <span class="etiqueta">Hora</span>
          <span class="hora" id="reloj-texto">09:00</span>
        </div>
        <div class="barra"><div id="barra-dia-relleno"></div></div>
        <div class="controles">
          <button id="btn-pausa" type="button">Pausa</button>
          <button id="btn-velocidad" type="button" title="Velocidad">x1</button>
          <button id="btn-reiniciar" type="button">Reiniciar día</button>
        </div>
      </section>

      <section class="bloque">
        <div class="metricas">
          <div class="metrica">
            <span class="metrica-valor" id="m-hechas">0</span>
            <span class="metrica-label">Terminadas</span>
          </div>
          <div class="metrica">
            <span class="metrica-valor" id="m-colillas">0</span>
            <span class="metrica-label">Colillas</span>
          </div>
        </div>
        <div class="estres">
          <div class="bloque-fila">
            <span class="etiqueta">Estrés</span>
            <span class="estres-nivel" id="m-estres">Tranqui</span>
          </div>
          <div class="barra"><div id="barra-estres-relleno"></div></div>
        </div>
      </section>

      <section class="bloque ultimo">
        <h2 class="etiqueta">Días jugados</h2>
        <table id="tabla-dias">
          <thead>
            <tr><th>WIP</th><th>Terminadas</th><th>Colillas</th><th>Estrés máx.</th></tr>
          </thead>
          <tbody id="tabla-dias-body"></tbody>
        </table>
      </section>
    </aside>

    <div id="banner-fin-dia" class="oculto">
      <p><strong>Fin del día.</strong> Mira la tabla o reinicia para probar otro WIP.</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
