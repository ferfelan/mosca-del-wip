<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Vista previa para compartir (1200 × 630)</title>
<!-- Imagen que muestran LinkedIn y WhatsApp al pegar el enlace. Portada v2
     (Parte A, 2026-10-26): la pregunta, la mosca en su escritorio con 9 tareas
     a la vez (la foto de las 13:30 del informe, docs/contexto/img/escena-wip9.jpg)
     y "Un juego de 1 minuto · mosca.deliverycraft.ai". Mismo fondo de noche y
     misma letra que la portada.
     Se abre con el servidor de prueba encendido (npm run dev) y se guarda con
     node scripts/vista-previa.mjs → public/img/vista-previa.jpg (?v=4 en
     index.html). La versión anterior, con el cerebro (5.2c), sigue en
     vista-previa-cerebro.html; la clara de la 5.1, en vista-previa-clara.html. -->
<style>
  @font-face {
    font-family: 'Mona Sans';
    src: url('/fonts/mona-sans-latin-wdth.woff2') format('woff2');
    font-weight: 200 900;
    font-stretch: 75% 125%;
  }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #060a16; color: #eef1f8;
    font-family: 'Mona Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .texto { position: absolute; left: 84px; top: 0; bottom: 0; width: 578px; display: flex; flex-direction: column; justify-content: center; }
  .marca { width: 56px; height: 56px; margin-bottom: 34px; }
  h1 { font-size: 56px; font-weight: 800; font-stretch: 103%; line-height: 1.06; letter-spacing: -0.032em; margin: 0 0 28px; }
  .pie { font-size: 24px; line-height: 1.4; color: #a9b1c4; margin: 0; }
  .pie b { font-weight: 650; color: #eef1f8; }
  /* La mosca en su escritorio, en un marco como el del clip de la portada,
     que sigue más allá del borde derecho */
  .marco {
    position: absolute; left: 672px; top: 92px; width: 700px; height: 437px;
    border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(170, 190, 255, 0.26);
    background: #0c1120;
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55), 0 0 0 6px rgba(255, 255, 255, 0.025);
  }
  .marco img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 38% 50%; }
  .estado {
    position: absolute; top: 16px; left: 18px;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 8px 16px 8px 14px; border-radius: 999px;
    background: rgba(10, 14, 28, 0.84); border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 16px; font-weight: 600; color: #f0675c; white-space: nowrap;
  }
  .estado::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
</style>
</head>
<body>
  <div class="marco">
    <img src="/docs/contexto/img/escena-wip9.jpg" alt="" />
    <span class="estado">Muchas tareas a la vez</span>
  </div>
  <div class="texto">
    <img class="marca" src="/favicon.svg" alt="" />
    <h1>Ocupado todo el día.<br />¿Y qué terminaste?</h1>
    <p class="pie"><b>Un juego de 1 minuto</b> · mosca.deliverycraft.ai</p>
  </div>
  <script>
    (async () => {
      await document.fonts.ready;
      const foto = document.querySelector('.marco img');
      if (!foto.complete) await new Promise((r) => (foto.onload = r));
      requestAnimationFrame(() => requestAnimationFrame(() => (document.body.dataset.listo = '1')));
    })();
  </script>
</body>
</html>
