<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Vista previa para compartir (1200 × 630)</title>
<!-- Imagen que muestran LinkedIn y WhatsApp al pegar el enlace. Se captura con
     agent-browser a 1200×630 y se guarda como public/img/vista-previa.jpg. -->
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #fcfaf6; color: #1d2532; font-family: 'Avenir Next', 'Helvetica Neue', Helvetica, sans-serif; }
  .texto { position: absolute; left: 76px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-family: 'Iowan Old Style', Charter, Georgia, serif; font-weight: 700; font-size: 108px; line-height: 0.98; letter-spacing: -0.02em; margin: 0 0 28px; }
  .lema { font-family: 'Iowan Old Style', Charter, Georgia, serif; font-weight: 700; font-size: 42px; line-height: 1.2; color: #2f7579; margin: 0 0 30px; max-width: 14ch; }
  .sub { font-size: 25px; line-height: 1.35; color: #556070; margin: 0; max-width: 24ch; }
  /* La ilustración (versión web, sin viñeta) llega hasta el borde derecho. */
  .arte { position: absolute; right: 0; top: -58px; height: 790px; width: auto; }
</style>
</head>
<body>
  <div class="texto">
    <h1>Mosca del WIP</h1>
    <p class="lema">Estar siempre ocupado no es lo mismo que avanzar.</p>
    <p class="sub">Un juego con el cerebro de una mosca real</p>
  </div>
  <img class="arte" src="/img/portada-torre.svg" alt="" />
</body>
</html>
